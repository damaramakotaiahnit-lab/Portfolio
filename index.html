                            className="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 focus:outline-none text-white text-sm placeholder:text-slate-500 transition-all"
                          />
                        </div>
                        <div className="space-y-1.5">
                          <label className="text-[11px] font-mono text-slate-300 uppercase font-semibold flex items-center gap-1.5">
                            <i data-lucide="mail" className="w-3.5 h-3.5 text-indigo-400"></i>
                            <span>Email Address</span>
                          </label>
                          <input 
                            type="email" 
                            required
                            placeholder="recruiter@company.com"
                            value={contactForm.email}
                            onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                            className="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 focus:outline-none text-white text-sm placeholder:text-slate-500 transition-all"
                          />
                        </div>
                      </div>

                      <div className="space-y-1.5">
                        <label className="text-[11px] font-mono text-slate-300 uppercase font-semibold flex items-center gap-1.5">
                          <i data-lucide="briefcase" className="w-3.5 h-3.5 text-indigo-400"></i>
                          <span>Subject / Role Title</span>
                        </label>
                        <input 
                          type="text" 
                          required
                          placeholder="Data Analyst Opportunity / Interview Invitation"
                          value={contactForm.subject}
                          onChange={(e) => setContactForm({ ...contactForm, subject: e.target.value })}
                          className="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 focus:outline-none text-white text-sm placeholder:text-slate-500 transition-all"
                        />
                      </div>

                      <div className="space-y-1.5">
                        <label className="text-[11px] font-mono text-slate-300 uppercase font-semibold flex items-center gap-1.5">
                          <i data-lucide="message-square" className="w-3.5 h-3.5 text-indigo-400"></i>
                          <span>Message</span>
                        </label>
                        <textarea 
                          rows="4" 
                          required
                          placeholder="Role requirements, interview details, or inquiries..."
                          value={contactForm.message}
                          onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                          className="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700/80 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 focus:outline-none text-white text-sm placeholder:text-slate-500 resize-none transition-all"
                        ></textarea>
                      </div>

                      <button 
                        type="submit"
                        className="w-full py-3.5 sm:py-4 rounded-xl font-bold text-white bg-gradient-to-r from-indigo-600 via-purple-600 to-sky-500 hover:from-indigo-500 hover:to-sky-400 active:scale-[0.99] shadow-xl shadow-indigo-500/25 transition-all flex items-center justify-center gap-2 border border-indigo-400/30 cursor-pointer"
                      >
                        <span>Send Direct Message</span>
                        <i data-lucide="send" className="w-4 h-4"></i>
                      </button>
                    </form>
                  )}

                </div>

              </div>

            </div>
          </section>

          {/* FOOTER: ULTRA-RESPONSIVE PILL SYSTEM PREVENTING ANY HORIZONTAL OVERFLOW */}
          <footer className="py-12 relative z-10 border-t border-slate-800 bg-[#080c16] w-full overflow-hidden">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
              <div className="flex flex-col items-center justify-center gap-6 text-center">
                
                {/* Brand info */}
                <div className="flex flex-wrap items-center gap-3 justify-center">
                  <div className="w-9 h-9 rounded-full overflow-hidden border border-indigo-500/40 p-[1px] bg-indigo-500/20 flex-shrink-0">
                    <img 
                      src={PORTFOLIO_DATA.profile.avatar} 
                      alt="RD"
                      className="w-full h-full object-cover rounded-full"
                      onError={(e) => {
                        const target = e.currentTarget;
                        if (!target.dataset.fallback) {
                          target.dataset.fallback = '1';
                          target.src = './Ramakotaiah Dama _ LinkedIn_files/1793940865669';
                        }
                      }}
                    />
                  </div>
                  <span className="text-sm font-bold text-white tracking-tight">
                    {PORTFOLIO_DATA.profile.name}
                  </span>
                  <span className="text-xs text-slate-400 font-mono">
                    © {new Date().getFullYear()} All Rights Reserved.
                  </span>
                </div>

                {/* Footer Nav Links - Touch-friendly pills that wrap gracefully on any screen */}
                <div className="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 max-w-3xl text-xs font-medium text-slate-300">
                  <a href="#hero" className="px-3 py-1.5 rounded-xl bg-slate-900/80 hover:bg-indigo-600/30 hover:text-white border border-slate-800 hover:border-indigo-500/40 transition-colors">Home</a>
                  <a href="#about" className="px-3 py-1.5 rounded-xl bg-slate-900/80 hover:bg-indigo-600/30 hover:text-white border border-slate-800 hover:border-indigo-500/40 transition-colors">About</a>
                  <a href="#skills" className="px-3 py-1.5 rounded-xl bg-slate-900/80 hover:bg-indigo-600/30 hover:text-white border border-slate-800 hover:border-indigo-500/40 transition-colors">Skills</a>
                  <a href="#projects" className="px-3 py-1.5 rounded-xl bg-slate-900/80 hover:bg-indigo-600/30 hover:text-white border border-slate-800 hover:border-indigo-500/40 transition-colors">Projects (10)</a>
                  <a href="#education" className="px-3 py-1.5 rounded-xl bg-slate-900/80 hover:bg-indigo-600/30 hover:text-white border border-slate-800 hover:border-indigo-500/40 transition-colors">Education (JNTUK)</a>
                  <a href="#certifications" className="px-3 py-1.5 rounded-xl bg-slate-900/80 hover:bg-indigo-600/30 hover:text-white border border-slate-800 hover:border-indigo-500/40 transition-colors">Certifications (8)</a>
                  <a href="./resume.html" target="_blank" className="px-3 py-1.5 rounded-xl bg-emerald-500/15 text-emerald-300 hover:bg-emerald-500/25 border border-emerald-500/30 transition-colors flex items-center gap-1">
                    <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                    <span>ATS Resume</span>
                  </a>
                  <a href="#contact" className="px-3 py-1.5 rounded-xl bg-slate-900/80 hover:bg-indigo-600/30 hover:text-white border border-slate-800 hover:border-indigo-500/40 transition-colors">Contact</a>
                  <a href={PORTFOLIO_DATA.profile.linkedin} target="_blank" className="px-3 py-1.5 rounded-xl bg-indigo-500/15 text-indigo-300 hover:bg-indigo-500/25 border border-indigo-500/30 transition-colors flex items-center gap-1">
                    <i data-lucide="linkedin" className="w-3.5 h-3.5"></i>
                    <span>LinkedIn</span>
                  </a>
                </div>

                {/* Tech Badges */}
                <div className="flex flex-wrap items-center justify-center gap-2 text-xs font-mono text-slate-400 pt-2 border-t border-slate-800/60 w-full max-w-md">
                  <span>Engineered with</span>
                  <span className="text-indigo-400 font-semibold">React</span>
                  <span>•</span>
                  <span className="text-purple-400 font-semibold">Tailwind CSS</span>
                  <span>•</span>
                  <span className="text-sky-400 font-semibold">TypeScript</span>
                </div>

              </div>
            </div>
          </footer>

          {/* PROJECT DEEP DIVE MODAL */}
          {selectedProject && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="glass-card max-w-3xl w-full rounded-3xl border border-indigo-500/30 p-5 sm:p-8 space-y-5 sm:space-y-6 relative max-h-[92vh] overflow-y-auto">
                <button 
                  onClick={() => setSelectedProject(null)}
                  className="absolute top-5 right-5 sm:top-6 sm:right-6 p-2 rounded-xl bg-slate-900 border border-indigo-500/20 text-slate-400 hover:text-white transition-colors"
                >
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>

                <div className="space-y-2">
                  <div className="flex items-center gap-2">
                    <span className="px-3 py-1 rounded-md bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 text-xs font-mono font-bold">
                      {selectedProject.projectNumber}
                    </span>
                    <span className="text-xs text-slate-400 font-mono">
                      {selectedProject.category}
                    </span>
                  </div>
                  <h3 className="text-xl sm:text-2xl md:text-3xl font-extrabold text-white">
                    {selectedProject.title}
                  </h3>
                  <p className="text-slate-400 text-xs sm:text-sm">
                    {selectedProject.subtitle}
                  </p>
                </div>

                <div className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 text-slate-300 text-xs sm:text-sm leading-relaxed">
                  {selectedProject.description}
                </div>

                {selectedProject.daxFunctions && selectedProject.daxFunctions.length > 0 && (
                  <div className="space-y-3">
                    <h4 className="text-xs sm:text-sm font-bold text-indigo-300 uppercase tracking-wider font-mono flex items-center gap-2">
                      <i data-lucide="sparkles" className="w-4 h-4 text-purple-400"></i>
                      Key DAX Functions & Formulations Engineered:
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs font-mono">
                      {selectedProject.daxFunctions.map((dax, dIdx) => (
                        <div key={dIdx} className="p-2.5 rounded-xl bg-slate-950 border border-indigo-500/20 text-indigo-200">
                          • {dax}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="space-y-3">
                  <h4 className="text-xs sm:text-sm font-bold text-white uppercase tracking-wider font-mono">
                    Architecture & Engineering Workflows:
                  </h4>
                  <ul className="space-y-2 text-xs sm:text-sm text-slate-300">
                    {selectedProject.highlights.map((h, i) => (
                      <li key={i} className="flex items-start gap-2.5">
                        <i data-lucide="check-circle" className="w-4 h-4 text-indigo-400 mt-0.5 flex-shrink-0"></i>
                        <span>{h}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-xs sm:text-sm text-indigo-200">
                  <strong className="text-white block font-mono text-xs uppercase mb-1">Business Impact & Stakeholder Value:</strong>
                  {selectedProject.businessImpact}
                </div>

                <div className="flex flex-wrap sm:flex-nowrap gap-2 sm:gap-3 pt-4 border-t border-slate-800">
                  <button 
                    onClick={() => setSelectedProject(null)}
                    className="flex-1 min-w-[120px] py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 via-purple-600 to-sky-500 text-white font-bold text-xs sm:text-sm shadow-lg hover:shadow-indigo-500/25 transition-all"
                  >
                    Done Exploring
                  </button>
                  <a 
                    href={selectedProject.linkedinPostUrl || PORTFOLIO_DATA.profile.linkedin} 
                    target="_blank" 
                    className="py-3 px-4 rounded-xl bg-indigo-600/25 text-indigo-300 hover:text-white font-semibold text-xs sm:text-sm border border-indigo-500/40 hover:bg-indigo-600/40 transition-colors flex items-center justify-center gap-2"
                  >
                    <i data-lucide="linkedin" className="w-4 h-4 text-indigo-400"></i>
                    <span>LinkedIn Post</span>
                  </a>
                  <a 
                    href={selectedProject.githubUrl} 
                    target="_blank" 
                    className="py-3 px-4 rounded-xl bg-slate-900 text-white font-semibold text-xs sm:text-sm text-center border border-indigo-500/30 hover:bg-slate-800 transition-colors flex items-center justify-center gap-2"
                  >
                    <span>GitHub</span>
                    <i data-lucide="github" className="w-4 h-4"></i>
                  </a>
                </div>

              </div>
            </div>
          )}

          {/* CERTIFICATE MODAL PREVIEW */}
          {selectedCert && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="glass-card max-w-3xl w-full rounded-3xl border border-indigo-500/30 p-5 sm:p-6 space-y-4 sm:space-y-5 relative max-h-[92vh] overflow-y-auto">
                <button 
                  onClick={() => setSelectedCert(null)}
                  className="absolute top-4 right-4 sm:top-5 sm:right-5 p-2 rounded-xl bg-slate-900 border border-indigo-500/20 text-slate-400 hover:text-white"
                >
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>

                <div className="flex items-center gap-2">
                  <span className="px-2.5 py-1 rounded-md bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 text-xs font-mono font-semibold">
                    {selectedCert.issuer}
                  </span>
                  <span className="text-xs text-slate-400 font-mono">
                    Issued {selectedCert.issueDate}
                  </span>
                </div>

                <h3 className="text-lg sm:text-xl md:text-2xl font-bold text-white">
                  {selectedCert.title}
                </h3>

                <div className="rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 flex items-center justify-center max-h-[450px]">
                  <img 
                    src={selectedCert.image} 
                    alt={selectedCert.title}
                    className="w-full h-auto max-h-[450px] object-contain"
                  />
                </div>

                <div className="p-3.5 sm:p-4 rounded-xl bg-slate-900/90 border border-indigo-500/20 space-y-2">
                  <span className="text-xs font-mono uppercase tracking-wider text-indigo-400 font-bold block">
                    Verification Details & Competency
                  </span>
                  <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                    {selectedCert.description}
                  </p>
                  {selectedCert.credentialId && (
                    <div className="text-xs font-mono text-slate-400 pt-1">
                      Credential ID: <strong className="text-slate-200">{selectedCert.credentialId}</strong>
                    </div>
                  )}
                </div>

                <div className="flex gap-3 pt-2">
                  <a 
                    href={selectedCert.verificationUrl}
                    target="_blank"
                    className="flex-1 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-xs sm:text-sm text-center shadow-lg hover:shadow-indigo-500/25 transition-all flex items-center justify-center gap-2"
                  >
                    <span>Open Verification Link</span>
                    <i data-lucide="external-link" className="w-4 h-4"></i>
                  </a>
                  <button 
                    onClick={() => setSelectedCert(null)}
                    className="px-5 py-3 rounded-xl bg-slate-900 text-slate-300 hover:text-white font-semibold text-xs sm:text-sm border border-indigo-500/30 transition-colors"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
